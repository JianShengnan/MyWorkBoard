# 80：只做 ACME 校验与跳转 HTTPS。
# 保留 ACME 是因为证书续期（certbot renew --webroot）需要这条路径可达。
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # 固定跳到域名而不是 $host：否则用 IP 访问会被跳到 https://<IP>，
        # 证书是签给域名的，浏览器直接报证书不匹配。
        return 301 https://jsn1024.cn$request_uri;
    }
}

# 443：正式入口。证书由宿主机 certbot 签发，目录只读挂载进容器。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/jsn1024.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsn1024.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # http 与 https 共用同一份 location 配置，避免两处漂移。
    # 必须放在 conf.d 之外：conf.d/*.conf 会被主配置整体 include，
    # 片段里直接写 location 会被当成 http 级指令而启动失败。
    include /etc/nginx/locations.conf;
}
